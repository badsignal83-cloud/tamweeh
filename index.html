<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>تمويه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one narrow game card per screen, pass-the-phone flow; majlis night palette, committed single dark look */
:root{
  --ink:#141a2e; --ink-2:#1d2540; --ink-3:#2a3456;
  --saffron:#f2b632; --saffron-deep:#c98a12;
  --pom:#e0455e; --mint:#5fd3b0; --sky:#7aa7ff;
  --paper:#f4efe4; --muted:#a5adc8; --line:#33406a;
  --display:"Lalezar","Readex Pro","Segoe UI",Tahoma,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--ink);
  background-image:radial-gradient(circle at 50% -10%, #2b3a78 0, transparent 55%),
    repeating-linear-gradient(45deg, transparent 0 22px, rgba(255,255,255,.025) 22px 23px),
    repeating-linear-gradient(-45deg, transparent 0 22px, rgba(255,255,255,.025) 22px 23px);
  color:var(--paper); font-family:var(--body); font-size:16px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:20px;
}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--saffron);
  text-shadow:0 3px 0 var(--saffron-deep), 0 6px 0 rgba(0,0,0,.35);letter-spacing:0}
.tag{font-size:.8rem;color:var(--muted)}
.round-pill{font-size:.8rem;background:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--ink-2);border:2px solid var(--line);border-radius:22px;padding:20px;
  box-shadow:0 8px 0 #0c1020;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.9rem} h2{font-size:1.45rem}
.eyebrow{font-size:.78rem;color:var(--saffron);letter-spacing:.04em}
.muted{color:var(--muted);font-size:.9rem}
.q{font-size:1.2rem;font-weight:500;line-height:1.7}
.emo{font-size:2.6rem;line-height:1.5;text-align:center;margin:10px 0 4px;letter-spacing:6px}
.qimg{margin:10px auto 6px;border-radius:12px;overflow:hidden;max-width:420px}
.qimg svg{display:block;width:100%;height:auto}
.qimg.map{background:#9cc3e6}.qimg.map path{fill:#f3efe4;stroke:#7d8aa3;stroke-width:.5;stroke-linejoin:round}
.qimg.map path.hl{fill:#e23b3b;stroke:#7a1010}
.qimg.map .ring{fill:none;stroke:#e23b3b;stroke-width:2.5}
.qimg.map .dot{fill:#e23b3b;stroke:#fff;stroke-width:1.8}.qimg.map .dot-o{fill:rgba(226,59,59,.25)}
.qimg.flag{max-width:260px;box-shadow:0 2px 10px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15)}
.stepper{display:flex;align-items:center;gap:14px}.stepper .chip{width:44px;height:44px;padding:0;font-size:1.4rem;line-height:1}.stepper .chip:disabled{opacity:.35}.stepper b{min-width:90px;text-align:center;font-size:1.05rem}
.hint{display:flex;gap:6px;align-items:flex-start;background:rgba(255,200,80,.1);border:1px dashed rgba(255,200,80,.45);border-radius:10px;padding:7px 10px;margin:8px 0 10px;font-size:.92rem;line-height:1.6}
.cat-chip{align-self:flex-start;font-size:.78rem;background:var(--ink-3);border-radius:999px;padding:3px 12px;color:var(--sky)}
label{font-size:.9rem;color:var(--muted)}
input[type=text]{width:100%;font:inherit;font-size:1.05rem;color:var(--paper);background:var(--ink);
  border:2px solid var(--line);border-radius:14px;padding:12px 14px}
input[type=text]:focus{outline:none;border-color:var(--saffron)}
.btn{font:inherit;font-family:var(--display);font-size:1.3rem;border:0;border-radius:16px;padding:12px 18px;cursor:pointer;
  color:#2a1a00;background:var(--saffron);box-shadow:0 5px 0 var(--saffron-deep);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--saffron-deep)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn.pom{background:var(--pom);color:#fff;box-shadow:0 5px 0 #9c2238}
.btn.ghost{background:var(--ink-3);color:var(--paper);box-shadow:0 5px 0 #121830}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.players{display:flex;flex-direction:column;gap:8px}
.player-row{display:flex;gap:8px;align-items:center}
.player-row input{flex:1;min-width:0}
.icon-btn{flex:0 0 44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--ink);color:var(--muted);font-size:1.2rem;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.9rem;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--ink);color:var(--muted);cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--saffron);color:var(--paper);background:rgba(242,182,50,.12)}
.opts{display:flex;flex-direction:column;gap:10px}
.ans-big{text-align:center;margin:10px 0;font-size:1.05rem}.ans-big b{font-family:var(--display);font-size:1.7rem;color:var(--mint);margin-inline-start:6px}
.ogrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ogrid .opt{flex-direction:column;align-items:stretch;gap:4px;padding:10px 10px 9px;font-size:.98rem;min-height:64px;justify-content:center;position:relative;text-align:center}
.ogrid .opt .letter{position:absolute;top:6px;inset-inline-start:6px;width:20px;height:20px;flex:none;border-radius:6px;font-size:.8rem}
.ogrid .opt .ot{font-weight:700;line-height:1.35;word-break:break-word;padding-inline:14px}
.ogrid .opt .tag{font-size:.72rem;border-radius:999px;padding:1px 8px;align-self:center;background:var(--ink-3);color:var(--muted)}
.ogrid .opt .by{font-size:.74rem;color:var(--muted);line-height:1.35}
.ogrid .opt .by b{color:var(--paper);font-weight:500}
.ogrid .opt.rv-true{border-color:var(--mint);background:rgba(95,211,176,.14)}
.ogrid .opt.rv-true .tag{background:var(--mint);color:#06281e;font-weight:700}
.ogrid .opt.rv{cursor:default}
.ogrid .opt.mine{border-color:var(--saffron);background:rgba(242,182,50,.10)}
.ogrid .opt.dim{opacity:.55;cursor:default}
.ogrid .opt.wide{grid-column:1/-1}
.opt{font:inherit;font-size:1.05rem;text-align:right;padding:14px 16px;border-radius:16px;border:2px solid var(--line);
  background:var(--ink);color:var(--paper);cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .letter{flex:0 0 32px;height:32px;border-radius:10px;background:var(--ink-3);display:grid;place-items:center;font-family:var(--display);color:var(--saffron);font-size:1.1rem}
@media (hover:hover){.opt:hover{border-color:var(--sky)}}
.err{color:var(--pom);font-size:.9rem;min-height:1.4em}
.handoff{align-items:center;text-align:center;padding-block:36px}
.handoff .big-name{font-family:var(--display);font-size:3rem;color:var(--saffron);line-height:1.1}
.mascot{width:96px;height:96px}
.reveal-list{display:flex;flex-direction:column;gap:10px}
.rv{border-radius:16px;border:2px solid var(--line);padding:12px 14px;background:var(--ink);display:flex;flex-direction:column;gap:4px}
.rv.true{border-color:var(--mint);background:rgba(95,211,176,.08)}
.rv .ans{font-weight:700}
.rv .who{font-size:.85rem;color:var(--muted)}
.rv .who b{color:var(--paper);font-weight:500}
.badge{font-size:.75rem;border-radius:999px;padding:2px 10px;align-self:flex-start}
.badge.t{background:var(--mint);color:#06281e}
.badge.f{background:var(--ink-3);color:var(--muted)}
.score-list{display:flex;flex-direction:column;gap:8px}
.sc{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--ink)}
.sc .rank{font-family:var(--display);color:var(--muted);width:24px;font-size:1.2rem}
.sc .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.sc .pts{font-family:var(--display);font-size:1.4rem;color:var(--saffron);font-variant-numeric:tabular-nums}
.sc .gain{font-size:.85rem;color:var(--mint);font-variant-numeric:tabular-nums}
.sc.lead{outline:2px solid var(--saffron)}
.rules{margin:0;padding-inline-start:20px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.progress{display:flex;gap:6px;justify-content:center}
.progress span{width:10px;height:10px;border-radius:50%;background:var(--ink-3)}
.progress span.done{background:var(--saffron)}
.timer{display:flex;align-items:center;gap:10px}
.timer .bar{flex:1;height:10px;border-radius:999px;background:var(--ink);overflow:hidden;border:1px solid var(--line)}
.timer .fill{height:100%;width:100%;background:var(--mint);border-radius:999px;transition:width .25s linear,background .3s}
.timer .fill.warn{background:var(--saffron)} .timer .fill.danger{background:var(--pom)}
.timer .sec{font-family:var(--display);font-size:1.4rem;min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}
.cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat-tile{font:inherit;text-align:right;border-radius:18px;border:2px solid var(--line);background:var(--ink);color:var(--paper);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cat-tile b{font-family:var(--display);font-weight:400;font-size:1.25rem;color:var(--saffron)}
.cat-tile small{color:var(--muted);font-size:.8rem}
@media (hover:hover){.cat-tile:hover{border-color:var(--saffron)}}
.cat-tile[disabled]{opacity:.35;cursor:not-allowed}
.cat-tile:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.code-box{font-family:var(--display);font-size:3rem;letter-spacing:.25em;text-align:center;color:var(--saffron);background:var(--ink);border:2px dashed var(--line);border-radius:18px;padding:8px 12px;user-select:all}
.you{font-size:.7rem;background:var(--ink-3);color:var(--sky);border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle}
.notice{background:rgba(242,182,50,.12);border:1px solid var(--saffron);color:var(--paper);border-radius:14px;padding:10px 14px;font-size:.9rem}
.btn.small{font-size:1rem;padding:8px 12px;box-shadow:0 3px 0 #121830}
.chip small{opacity:.7;font-size:.75em}
.chip.closed{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.status-list{display:flex;flex-direction:column;gap:6px}
.st-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--ink)}
.st-row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.st-row.alert{outline:2px solid var(--pom)}
.st{font-size:.8rem;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st.ok{background:var(--mint);color:#06281e}.st.wait{background:var(--ink-3);color:var(--muted)}
.st.warn{background:var(--pom);color:#fff}.st.off{background:var(--ink-3);color:var(--pom)}
.left{color:var(--pom);font-size:.75rem}
.notice.alert{border-color:var(--pom);background:rgba(224,69,94,.15)}
.btn.exit{opacity:.85;margin-top:4px}
.mrole{display:flex;gap:12px;align-items:center;margin:8px 0}.mrole>span{font-size:2.6rem}.mrole b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--saffron)}.mrole small{color:var(--muted);line-height:1.5}
.mlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.mp{border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}.mp.dead{opacity:.55}.mp.me{border-color:var(--saffron)}.mp small{color:var(--muted)}
.mev{margin:6px 0;line-height:1.6}.mclock{font-family:var(--display);font-size:2.6rem;text-align:center;color:var(--saffron);direction:ltr}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.xbtn{font:inherit;font-size:.72rem;line-height:1;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.xbtn.armed{background:var(--pom);border-color:var(--pom);color:#fff}
.btn.wa{background:#25d366;color:#05301a;box-shadow:0 5px 0 #128c4a;text-decoration:none;text-align:center}
.invite-link{font-size:.8rem;color:var(--muted);text-align:center;user-select:all;overflow-wrap:anywhere}
.round-pill.tb{background:var(--pom);border-color:var(--pom);color:#fff}
.notice.tbn{border-color:var(--saffron);text-align:center;font-weight:500}
.uid-box{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}.uid-box code{direction:ltr;font-size:.8rem;background:rgba(0,0,0,.06);padding:4px 6px;border-radius:6px;word-break:break-all}
.ok-msg{color:#7fdcae;margin:8px 0}
#bankfile{display:block;margin:6px 0;color:var(--muted)}
.sid{direction:ltr;font-size:.72rem;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--ink);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--saffron);font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.stbl{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.stbl th{color:var(--muted);font-weight:500;text-align:start;padding:6px 8px;border-bottom:1px solid var(--line)}
.stbl td{padding:8px;border-bottom:1px solid var(--line)}
.stbl td.rk{color:var(--muted)}.stbl td.nm{font-weight:700}
.game-row{background:var(--ink);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.gr-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.85rem}
.gr-pl{display:flex;flex-wrap:wrap;gap:6px}.gr-pl span{background:var(--ink-3);border-radius:999px;padding:2px 10px;font-size:.85rem}
.gr-pl span.win{background:rgba(242,182,50,.2);outline:1px solid var(--saffron)}.gr-win{font-size:.85rem;color:var(--saffron)}
.q-row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ink);border-radius:12px;padding:8px 12px}
.q-t{font-size:.9rem;min-width:0}.q-p{font-family:var(--display);color:var(--saffron);white-space:nowrap}
.foot{text-align:center;font-size:.75rem;color:var(--muted);margin-top:auto}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
.card{animation:pop .22s ease-out}
@media (prefers-reduced-motion:reduce){.card{animation:none}.btn{transition:none}}
</style>

const MAX_PLAYERS = 12;
const BANK = [

  // فنربط الاسم بالجهاز إذا سبق أن استخدم صاحب الجهاز هذا الاسم أونلاين، وإلا نعدّه بالاسم

  const addName=(id,n)=>{const k=nameKey(n); if(!id||!k) return; (devNames[id]=devNames[id]||new Set()).add(k);};
  games.forEach(x=>x.p.forEach(pl=>addName(pl.id,pl.n)));

  games.slice().reverse().forEach(x=>x.p.forEach(pl=>{

  const players=Object.values(P).sort((a,b)=>b.w-a.w||b.s-a.s);
  // الأجهزة: كل من فتح التطبيق، حتى لو لم يلعب
  const devPlayed={}; games.forEach(x=>{const ids=new Set(x.p.map(p=>p.id).filter(Boolean)); if(x.dev) ids.add(x.dev); ids.forEach(id=>devPlayed[id]=(devPlayed[id]||0)+1);});

let LAST_HTML=null;
// مقارنة الصفحة الحالية بالجديدة وتعديل الفروق فقط: لا يرمش العداد ولا الصور عند وصول تحديث من لاعب آخر
function morphChildren(a,b){
  const an=[...a.childNodes], bn=[...b.childNodes];
  for(let i=0;i<bn.length;i++){
    const x=an[i], y=bn[i];
    if(!x){a.appendChild(y);continue;}
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName||(x.nodeType===1&&(x.id||"")!==(y.id||""))){a.replaceChild(y,x);continue;}
    if(x.nodeType!==1){ if(x.nodeValue!==y.nodeValue) x.nodeValue=y.nodeValue; continue; }
    for(const at of [...x.attributes]) if(!y.hasAttribute(at.name)) x.removeAttribute(at.name);
    for(const at of [...y.attributes]) if(x.getAttribute(at.name)!==at.value) x.setAttribute(at.name,at.value);
    if(x.nodeName==="BUTTON") x.disabled=y.hasAttribute("disabled");
    if(x.nodeName==="INPUT"||x.nodeName==="TEXTAREA"||x.nodeName==="SELECT") continue;
    morphChildren(x,y);
  }
  for(let i=an.length-1;i>=bn.length;i--) if(an[i].parentNode===a) a.removeChild(an[i]);
}
function render(){
  const ae=document.activeElement,fid=ae&&app.contains(ae)&&ae.id?ae.id:null,keep={};
  let ss=null,se=null;try{if(fid){ss=ae.selectionStart;se=ae.selectionEnd;}}catch(e){}
  app.querySelectorAll("input[data-keep]").forEach(i=>keep[i.id]=i.value);
  let v = VIEWS[S.screen]();
  const foot = S.screen==="online"?"نموذج أولي · كل لاعب من جواله":S.screen==="home"?"نموذج أولي":"نموذج أولي · جهاز واحد يتنقل بين اللاعبين";
  const html=header()+v+`<div class="foot">${foot} · الإصدار ${APP_VERSION}</div>`;
  if(html!==LAST_HTML){ LAST_HTML=html; const tp=document.createElement("template"); tp.innerHTML=html; morphChildren(app,tp.content); }
  Object.entries(keep).forEach(([id,val])=>{const el=document.getElementById(id);if(el&&!el.value&&val) el.value=val;});
  const fe=fid&&document.getElementById(fid);
  if(fe){fe.focus();try{if(ss!=null) fe.setSelectionRange(ss,se);}catch(e){}}
  else{const f=app.querySelector("[autofocus]"); if(f) f.focus();}
  tick();
}
let iv=null;
function startTimer(){stopTimer(); if(!S.timer) return; S.deadline=Date.now()+S.timer*1000; iv=setInterval(tick,250);}
function stopTimer(){clearInterval(iv); iv=null; S.deadline=0;}
function tick(){
  if(!S.deadline) return;
  const left=Math.max(0,S.deadline-Date.now()), sec=Math.ceil(left/1000), frac=left/(S.timer*1000);
  const fl=document.getElementById("tfill"), sc=document.getElementById("tsec");
  if(fl){fl.style.width=(frac*100)+"%"; fl.className="fill"+(frac<.25?" danger":frac<.5?" warn":"");}
  if(sc) sc.textContent=sec;
  if(left<=0){stopTimer(); if(S.screen==="write") submitFake(true); else if(S.screen==="pick") pick(-1);}
}

function lev(a,b){

const SIM_RATIO=0.8; // 80% تشابه في الحروف وترتيبها = نفس الإجابة

function sim(a0,b0){
  const a=a0.replace(/ /g,""), b=b0.replace(/ /g,"");
  const digits=/\d/.test(a)&&/\d/.test(b);
  if(a===b||!digits&&(Math.min(a.length,b.length)>=3&&(a.includes(b)||b.includes(a)))) return true;
  if(!/\d/.test(a)&&!/\d/.test(b)){
    // نحذف الكلمات المشتركة أولاً، فلا يتشابه «المحيط الهادئ» و«المحيط الهندي» بسبب كلمة «المحيط»
    const ta=a0.split(" "), tb=b0.split(" ");
    const x=ta.filter(t=>!tb.includes(t)).join(""), y=tb.filter(t=>!ta.includes(t)).join("");
    const m=Math.max(x.length,y.length);
    if(x&&y&&m>=4&&1-lev(x,y)/m>=SIM_RATIO) return true;
    // حرف ناقص أو زائد فقط (مثل «جزر لقمر» و«جزر القمر»)
    if(x&&y&&x.length<a.length&&Math.min(x.length,y.length)>=3&&Math.abs(x.length-y.length)===1&&lev(x,y)===1) return true;
    // حروف المد (ا و ي) تُكتب وتُحذف كثيراً: «نيوزيلندا» و«نيوزيلاند» لهما نفس الحروف الأساسية
    const sx=x.replace(/[اويء]/g,""), sy=y.replace(/[اويء]/g,""), sm=Math.max(sx.length,sy.length);
    if(sx.length>=4&&sy.length>=4&&(sx===sy||(sm>=5&&1-lev(sx,sy)/sm>=SIM_RATIO))) return true;
  }
  // إذا احتوى الجوابان أرقاماً، فهما متطابقان إذا كانت الأرقام نفسها (مثل «٢٠٦» و«206»، أو «4» و«أربع حجرات»)
  const na=(a.match(/\d+/g)||[]).sort().join(","), nb=(b.match(/\d+/g)||[]).sort().join(",");
  if(!na||na!==nb) return false;
  // نفس الأرقام: نعتبرهما متطابقين إلا إذا اختلفت الوحدة صراحةً (مثل «ثانية واحدة» و«دقيقة واحدة»)
  const la=a.replace(/\d+/g,""), lb=b.replace(/\d+/g,"");
  if(!la||!lb||la===lb||(Math.min(la.length,lb.length)>2&&(la.includes(lb)||lb.includes(la)))) return true;
  if((/[a-z]/.test(la)&&/[\u0600-\u06FF]/.test(lb))||(/[a-z]/.test(lb)&&/[\u0600-\u06FF]/.test(la))) return true;

  return m>=4&&1-lev(la,lb)/m>=SIM_RATIO;
}

const NUM_RE=/^[-+−]?[0-9٠-٩][0-9٠-٩.,٫]*%?$/;
function wordsAr(n){return n===1?"كلمة واحدة":n===2?"كلمتان":n<=10?n+" كلمات":n+" كلمة";}
function answerHint(q){
  if(!q||!q.a) return "";
  if(q.c==="emoji"||q.c==="emojien"){ const m=(q.q||"").match(/فيلم|مسلسل|مسرحية/); return `${m?m[0]:"عمل فني"} واكتب ${/[A-Za-z]/.test(q.a)?"بالإنجليزية":"بالعربية"}`; }
  if(q.c==="story") return `${q.h||"عمل فني"} · اكتب ${/[A-Za-z]/.test(q.a)?"بالإنجليزية":"بالعربية"}`;
  // التلميح يذكر لغة الكتابة فقط: لا عدد كلمات ولا «سنة» ولا وحدات
  const toks=q.a.trim().split(/\s+/), kind=t=>NUM_RE.test(t)?"n":/[A-Za-z]/.test(t)?"e":"a";
  const ks=new Set(toks.map(kind));
  if(ks.size===1&&ks.has("n")) return "اكتب بالأرقام الإنجليزية (123)";
  const NW=/^(و?ال)?(واحد|واحدة|اثن\S*|ثلاث\S*|أربع\S*|خمس\S*|ست|ستة|ستون|ستين|سبع\S*|ثمان\S*|تسع\S*|عشر\S*|مئ\S*|مائ\S*|ألف|آلاف|مليون|ملايين|مرتان|يومان|عامان|سنتان)$/;
  if(ks.size===1&&ks.has("a")) return /(^|[\s«(])كم\s/.test(q.q)&&toks.some(t=>NW.test(t))?"اكتب بالعربية (الرقم بالحروف)":"اكتب بالعربية";
  if(ks.size===1&&ks.has("e")) return "اكتب بالإنجليزية";
  if(ks.has("n")&&!ks.has("e")) return "اكتب الرقم بالإنجليزي مع الوحدة";
  // خليط إنجليزي وعربي، مثل فصيلة الدم «O سالب»
  const en=toks.filter(t=>kind(t)==="e"), ar=toks.filter(t=>kind(t)==="a");
  const ep=en.length===1&&en[0].length===1?"حرف إنجليزي":en.length===1?"كلمة إنجليزية":"كلمات إنجليزية";
  const ap=ar.length===1?"كلمة عربية":"كلمات عربية";
  return (kind(toks[0])==="e"?[ep,ap]:[ap,ep]).join(" و")+(ks.has("n")?" ورقم بالإنجليزي":"");
}
const hintHTML=q=>{const h=answerHint(q);return h?`<div class="hint"><span>💡</span><span>${h}</span></div>`:"";};
// نوحّد الأرقام العربية الهندية (١٢٣) إلى الإنجليزية مثل الحقيقة
const toLatinDigits=v=>v.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/٫/g,".");
function submitFake(timedOut){
  const el=document.getElementById("fake");
  const v=toLatinDigits(((el&&el.value)||"").trim()); S.draft=v;
  const er=S.mode==="bet"?(isFinite(parseNum(v))?"":"اكتب رقماً فقط، مثل 1500 أو 3.5"):fakeError(v);
  if(er&&!timedOut){S.err=er;return render();}
  stopTimer();
  if(!er) S.fakes[S.turn]=v;
  S.err=""; S.draft="";
  if(S.turn<S.players.length-1){S.turn++;S.screen="handoff";}
  else buildOptions();
  render();
}
function buildOptions(){
  if(S.mode==="bet"){ S.options=betSlots(S.fakes); S.phase="pick"; S.turn=0; S.screen="handoff"; return; }
  // كذبات متشابهة من لاعبين مختلفين تُدمج في خيار واحد يُنسب لهم جميعاً
  const groups=[];
  Object.entries(S.fakes).forEach(([p,t])=>{const k=norm(t);const g=groups.find(g=>sim(g.k,k));
    if(g) g.owner.push(+p); else groups.push({k,text:t,owner:[+p]});});
  const o=[{text:S.cur.a,owner:"true"},...groups.map(g=>({text:g.text,owner:g.owner}))];
  // فخاخ اللعبة تُختار بعد كتابة الجميع، ويُستبعد أي فخ يشبه كذبة لاعب
  const free=shuffle(S.cur.d).filter(d=>!groups.some(g=>sim(g.k,norm(d))));
  free.slice(0,Math.min(free.length,Math.max(1,4-o.length))).forEach(t=>o.push({text:t,owner:"house"}));
  S.options=shuffle(o); S.phase="pick"; S.turn=0; S.screen="handoff";
}
function pick(i){
  stopTimer();
  S.picks[S.turn]=i;
  if(S.mode==="bet"){ S.bets[S.turn]={s:i,x:Math.min(S.stake||0,S.scores[S.turn]||0)}; S.stake=0; }
  if(S.turn<S.players.length-1){S.turn++;S.screen="handoff";render();return;}
  score(); S.screen="reveal"; render();
}
function score(){
  if(S.mode==="bet"){
    const ans=parseNum(S.cur.a); S.betWin=betWinIdx(S.options,ans);
    const g=betGains(S.options,S.betWin,S.bets,S.scores,S.players.length);
    S.players.forEach((_,p)=>{S.gains[p]=g[p];S.scores[p]=(S.scores[p]||0)+g[p];});
    return;
  }
  {const ps=Object.values(S.picks).filter(v=>v>=0);recordStats(S.cur,ps.length,ps.filter(v=>S.options[v].owner==="true").length);}
  S.players.forEach((_,p)=>{
    let g=0; const ch=S.options[S.picks[p]];
    if(ch&&ch.owner==="true") g+=2;
    g+=Object.entries(S.picks).filter(([q,v])=>+q!==p&&v>=0&&Array.isArray(S.options[v].owner)&&S.options[v].owner.includes(p)).length;
    S.gains[p]=g; S.scores[p]=(S.scores[p]||0)+g;
    const st=S.pst[p]||(S.pst[p]={f:0,d:0,b:0,a:0});
    if(ch){st.a++; if(ch.owner==="true") st.f++; else st.b++;}
    st.d+=Object.entries(S.picks).filter(([q,v])=>+q!==p&&v>=0&&Array.isArray(S.options[v].owner)&&S.options[v].owner.includes(p)).length;
  });
}

  const db=fbInit(); if(!db) return null;
  return {
  claim: async(name)=>{
    await whenAuth();
    const r=await withTimeout(db.ref("rooms/"+name+"/host").transaction(v=>(!v||v===myPid)?myPid:undefined),10000);
    return !!(r&&r.committed);
  },
  join: async(name)=>{
    await whenAuth();
    const roomRef=db.ref("rooms/"+name), base=roomRef.child("peers"), me=base.child(myPid), connRef=db.ref(".info/connected");
    // لا نحذف اللاعب عند انقطاع قصير: نعلّمه غير متصل، ونعيد تثبيت حالته كاملة عند عودة الاتصال
    const full={};
    await withTimeout(me.child("joined").transaction(v=>v||Date.now()),10000);
    await withTimeout(me.update({on:true}),10000);
    let off=null; const offs=[];
    const api={
      onReconnect:null, onConnState:null, online:true,
      presence:(patch)=>{for(const k in patch){if(patch[k]===null) delete full[k]; else full[k]=patch[k];} return me.update(patch);},
      saveState:(str)=>roomRef.child("hs").set(str),
      // سجل الأسئلة لكل لاعب (بمعرّف جهازه)، مستقل عن الغرفة والمضيف
      loadSeen:async(pid)=>{const sn=await withTimeout(db.ref("seen/"+pid).once("value"),8000);return Object.keys(sn.val()||{});},
      markSeen:(pids,id)=>{const u={};pids.forEach(p=>u["seen/"+p+"/"+id]=true);return db.ref().update(u);},
      loadState:async()=>{const sn=await withTimeout(roomRef.child("hs").once("value"),10000);return sn.val();},
      setPriv:(pid,str)=>roomRef.child("priv/"+pid).set(str),
      onPriv:(cb)=>{const r=roomRef.child("priv/"+myPid),f=sn=>{let v=null;try{v=sn.val()?JSON.parse(sn.val()):null;}catch(e){}cb(v);};r.on("value",f);offs.push(()=>r.off("value",f));},
      act:(obj)=>roomRef.child("act/"+myPid).set(JSON.stringify(obj)),
      onActs:(cb)=>{const r=roomRef.child("act"),f=sn=>{const v=sn.val()||{},o={};for(const k in v){try{o[k]=JSON.parse(v[k]);}catch(e){}}cb(o);};r.on("value",f);offs.push(()=>r.off("value",f));},
      onPeers:(h,err)=>{
        const cb=snap=>{const v=snap.val()||{};
          const peers=Object.entries(v).map(([pid,p])=>({peer:pid,sameTab:pid===myPid,isMe:pid===myPid,kind:"viewer",presence:p||{}}))
            .sort((a,b)=>(a.presence.joined||0)-(b.presence.joined||0));
          h({peers});};
        base.on("value",cb,e=>err&&err(e)); off=()=>base.off("value",cb); return off;
      },
      leave: async()=>{ connRef.off("value",onConn); if(off) off(); offs.forEach(f=>{try{f();}catch(e){}}); try{await me.onDisconnect().cancel();}catch(e){} await me.remove(); }
    };
    const onConn=snap=>{
      const on=snap.val()===true; if(on!==api.online){ api.online=on; if(api.onConnState) api.onConnState(on); }
      if(!on) return;

      me.update(Object.assign({},full,{on:true}));

}
// Firebase يحذف المصفوفات الفارغة ويحوّل بعض الكائنات، فنعيد الحالة إلى شكلها المتوقع
function normG(g){
  if(!g) return g;
  const A=x=>Array.isArray(x)?x:(x&&typeof x==="object"?Object.values(x):[]);
  ["pl","pp","sc","dn","nf","np","gn","cats","q"].forEach(k=>{ if(g[k]!=null) g[k]=A(g[k]); });
  g.pl=g.pl||[];g.pp=g.pp||[];g.sc=g.sc||[];g.dn=g.dn||[];g.nf=g.nf||[];g.np=g.np||[];g.bad=g.bad||{};
  if(g.cats) g.cats=g.cats.map(A);
  if(g.op) g.op=A(g.op).map(x=>{x=A(x);return [x[0], x[1]==null?[]:(typeof x[1]==="string"?x[1]:A(x[1])), A(x[2])];});
  return g;
}

function hostReseat(H){
  if(!H.players||!H.players.length||["lobby","final"].includes(H.phase)) return;
  const inGame=new Set(H.players.map(p=>p.p)), offline=i=>{const pr=pres(H.players[i].p);return !pr||pr.on===false;};
  O.peers.forEach(p=>{
    const pr=p.presence; if(!pr||pr.on===false||inGame.has(p.peer)) return;
    let i=-1;
    if(pr.rc&&Number.isInteger(pr.rc.i)&&H.players[pr.rc.i]&&H.players[pr.rc.i].n===pr.rc.n) i=pr.rc.i;
    else { const nk=nameKey(pr.n||""); i=H.players.findIndex(pl=>nameKey(pl.n)===nk); }
    if(i<0||!offline(i)) return;
    H.players[i].p=p.peer; inGame.add(p.peer); if(H.seenA) delete H.seenA[i];

function hostStep(){

  if(H.mode==="mafia"&&H.phase!=="lobby"){ mafiaStep(H,now); publish(); return; }
  if(H.phase==="lobby"){
    const me=myPeer(),seen=[];
    O.peers.forEach(p=>{if(p.kind==="viewer"&&p.presence&&p.presence.n&&p.presence.on!==false&&!seen.some(s=>s.p===p.peer)) seen.push({p:p.peer,n:String(p.presence.n).slice(0,16)});});
    seen.sort((a,b)=>(b.p===me)-(a.p===me));
    H.players=seen.slice(0,MAX_PLAYERS);
    H.players.forEach(p=>loadSeenFor(p.p));
  }else if(H.phase==="choose"){
    const ch=H.players[(H.round-1)%H.players.length],pr=pres(ch.p);
    if(pr&&pr.c&&pr.c.r===H.round&&H.cats.includes(pr.c.k)&&remainingIn(H.used,pr.c.k)) hostSetQ(pr.c.k);
  }else if(H.phase==="write"){
    H.players.forEach((pl,i)=>{
      const pr=pres(pl.p),f=pr&&pr.f;
      if(f&&f.r===H.round&&typeof f.t==="string"&&f.a!==H.seenA[i]){
        H.seenA[i]=f.a;const t=f.t.trim().slice(0,40);
        if(!t.length||(H.mode==="bet"?!isFinite(parseNum(t)):isTruth(t,H.cur))){H.bad[i]=f.a;delete H.fakes[i];}
        else{H.fakes[i]=t;delete H.bad[i];}
      }
    });
    if(H.players.every((_,i)=>H.fakes[i]!=null)||(H.deadline&&now>H.deadline)) hostToPick();
  }else if(H.phase==="pick"){
    H.players.forEach((pl,i)=>{
      const pr=pres(pl.p),k=pr&&pr.k;
      if(H.mode==="bet"){ if(k&&k.r===H.round&&Number.isInteger(k.i)&&k.i>=0&&k.i<H.opts.length){H.picks[i]=k.i;(H.bets=H.bets||{})[i]={s:k.i,x:Math.max(0,Math.min(+k.x||0,H.scores[i]||0))};} }
      else if(k&&k.r===H.round&&Number.isInteger(k.i)&&k.i>=0&&k.i<H.opts.length&&!(Array.isArray(H.opts[k.i].o)&&H.opts[k.i].o.includes(i))) H.picks[i]=k.i;
    });
    if(H.players.every((_,i)=>H.picks[i]!=null)||(H.deadline&&now>H.deadline)) hostToReveal();
  }
  publish();
}
function hostDeadline(){HS.deadline=HS.timer?Date.now()+HS.timer*1000:0;}
function hostNextRound(){
  const H=HS;H.out=0;
  if(!H.cats.some(k=>remainingIn(0,k))){H.phase="final";H.out=1;H.deadline=0;return;}
  H.round++;H.phase="choose";H.deadline=0;H.cur=null;H.opts=[];H.fakes={};H.bad={};H.seenA={};H.picks={};H.bets={};H.win=0;H.gains={};
}
function hostSetQ(k){
  const H=HS;
  if(k==="random"){const av=H.cats.filter(c=>remainingIn(H.used,c));if(!av.length) return;k=av[Math.floor(Math.random()*av.length)];}
  const q=takeQRoom(k);
  if(!q) return;
  H.cur=q;H.phase="write";hostDeadline();
}
function hostToPick(){
  const H=HS,groups=[];
  if(H.mode==="bet"){ H.opts=betSlots(H.fakes); H.phase="pick"; H.picks={}; H.bets={}; hostDeadline(); return; }
  Object.entries(H.fakes).forEach(([p,t])=>{const k=norm(t),g=groups.find(g=>sim(g.k,k));if(g) g.o.push(+p);else groups.push({k,t,o:[+p]});});

  free.slice(0,Math.min(free.length,Math.max(1,4-o.length))).forEach(t=>o.push({t,o:"H"}));
  H.opts=shuffle(o);H.phase="pick";H.picks={};hostDeadline();
}
function hostToReveal(){

    const g=betGains(H.opts,H.win,H.bets||{},H.scores,H.players.length);

    H.gains[p]=g;H.scores[p]=(H.scores[p]||0)+g;

    if(ch){st.a++; if(ch.o==="T") st.f++; else st.b++;}
    st.d+=Object.entries(H.picks).filter(([q,v])=>+q!==p&&Array.isArray(H.opts[v].o)&&H.opts[v].o.includes(p)).length;
  });

}
function hostAction(a){

const MROLE={M:{n:"مافيا",e:"🔪",d:"تتفق مع فريقك كل ليلة على قتل لاعب، وتخدع المدينة في النهار."},
  P:{n:"الحامي",e:"🛡️",d:"كل ليلة تحمي لاعباً واحداً من القتل، وتستطيع حماية نفسك أو نفس اللاعب كل ليلة."},

const mafiaCount=n=>n<=6?1:n<=9?2:3;

function mDay(H){ H.phase="day"; H.tot=H.dur; H.deadline=Date.now()+H.dur*1000; H.rem=H.dur*1000; H.step++; }

}
function mafiaStep(H,now){

    if(voters.length&&voters.every(i=>H.votes[i]!=null)) mTally(H);
  }

}

    ${host?`<div class="row">${g.tot+60<=900?`<button class="btn ghost" data-o="mmore">+ دقيقة</button>`:""}<button class="btn" data-o="mvote">🗳️ ابدأ التصويت الآن</button></div>`:""}`;
  if(g.ph==="vote"){
    const voters=g.pl.map((_,i)=>i).filter(i=>g.al[i]), done=voters.filter(i=>g.vt[i]>=0).length;
    const mine=g.vt[me]>=0?g.vt[me]:sent("vote");

    const list=g.cd.map(i=>{const by=g.vt.map((t,v)=>t===i?v:-1).filter(v=>v>=0);

        :`<div class="opt rv"><span class="ot">${esc(g.pl[i])}${i===me?" (أنت)":""}</span><span class="by">${by.length?by.map(v=>esc(g.pl[v])).join("، "):"—"}</span></div>`;}).join("");

  if(g.ph==="verdict") return `${deadBanner}<section class="card"><div class="eyebrow">نتيجة التصويت</div>${ev}</section><section class="card">${mPlayersHTML(g,me,P)}</section>
    ${host?`<button class="btn" data-o="mnight">🌙 الليل التالي</button>`:waitCard("بانتظار المضيف…")}`;
  if(g.ph==="final"){

      <section class="card"><div class="eyebrow">كل الأدوار</div><div class="mlist">${g.pl.map((n,i)=>`<div class="mp${g.al[i]?"":" dead"}"><span>${g.al[i]?"🙂":"💀"} ${esc(n)}</span><small>${ar[i]?MROLE[ar[i]].e+" "+MROLE[ar[i]].n:""}</small></div>`).join("")}</div></section>
      ${host?`<button class="btn" data-o="again">لعبة جديدة بنفس اللاعبين</button>`:""}${leave}`;
  }
  return waitCard("…");
}
function mafiaClick(a,t){
  const T=+t.dataset.t;
  if(a==="mready") mAct("ready");
  else if(a==="msleep") mAct("sleep");
  else if(a==="mkill") mAct("kill",T);
  else if(a==="mprot") mAct("prot",T);
  else if(a==="mvoteto") mAct("vote",T);
  else if(a==="msnarm"){O.snArm=true;render();}
  else if(a==="msncancel"){O.snArm=false;render();}
  else if(a==="mshoot"){ if(O.snPick!==T){O.snPick=T;t.querySelector(".ot").textContent+=" — اضغط مرة ثانية للتأكيد";return true;} O.snArm=false;O.snPick=null;mAct("shoot",T); }
  else if(O.host&&a==="mskip") mafiaAction("skip");
  else if(O.host&&a==="mdiscuss") mafiaAction("discuss");
  else if(O.host&&a==="mmore") mafiaAction("more");
  else if(O.host&&a==="mvote") mafiaAction("vote");
  else if(O.host&&a==="mendvote") mafiaAction("endvote");
  else if(O.host&&a==="mnight") mafiaAction("night");
  else return false;
  return true;
}

    const nextBtn=O.host?`<button class="btn" data-o="next">${g.last===2?"⚔️ جولة كسر التعادل":g.last?"النتيجة النهائية":"الجولة التالية"}</button>`:waitCard("بانتظار المضيف للجولة التالية");
    if(O.showSc) return `${scoreListO(true)}${nextBtn}<button class="btn ghost small" data-o="showans">↩ رجوع للإجابات</button>`;
    const grid=optGrid(g.op.map(([t,o,by],i)=>({t,L:LET[i]||i+1,kind:o==="T"?"T":o==="H"?"H":"F",owners:Array.isArray(o)?o.map(i=>g.pl[i]):[],by:by.map(i=>g.pl[i])})),"reveal");
    const leftNames=g.pl.map((n,i)=>({n,k:playerState(g,i).left})).filter(x=>x.k);
    const late=[leftNames.length?`⚠️ خرج من التطبيق أثناء الجولة: ${leftNames.map(x=>esc(x.n)+(x.k>1?` (${x.k} مرات)`:"")).join("، ")}`:"",g.nf.length&&g.pl.length>1?`لم يكتب كذبة في الوقت: ${g.nf.map(i=>esc(g.pl[i])).join("، ")}`:"",g.np.length?`لم يختر في الوقت: ${g.np.map(i=>esc(g.pl[i])).join("، ")}`:""].filter(Boolean).map(t=>`<div class="muted">${t}</div>`).join("");
    return `<section class="card">${qBlock}${grid}${late}</section>
      <button class="btn" data-o="showsc">📊 النتائج</button>`;
  }
  if(g.ph==="final"){
    const r=g.pl.map((n,i)=>({n,s:g.sc[i]||0})).sort((a,b)=>b.s-a.s),top=r[0],tops=r.filter(p=>p.s===top.s);
    return `<section class="card handoff">${mascot}${g.out?'<div class="notice">انتهت أسئلة الفئات المختارة، فانتهت اللعبة قبل آخر جولة.</div>':""}<div class="muted">${tops.length>1?"تعادل في القمة!":"الفائز"}</div>
      <div class="big-name">${tops.map(p=>esc(p.n)).join(" و ")}</div><div class="muted">${top.s} نقطة</div></section>
      ${scoreListO(false)}${O.host?`<button class="btn" data-o="again">لعبة جديدة بنفس اللاعبين</button>`:""}${leave}`;
  }
  return waitCard("…");
}
// رابط دعوة يفتح الغرفة نفسها مباشرة
function inviteURL(){return location.origin+location.pathname+"?room="+O.code.toUpperCase();}
function inviteText(){return `تعال العب معي «تمويه» 🎭 اضغط الرابط وادخل الغرفة ${O.code.toUpperCase()}:\n${inviteURL()}`;}
async function shareInvite(){
  const text=inviteText(), url=inviteURL();
  try{ if(navigator.share){ await navigator.share({title:"تمويه",text:`تعال العب معي «تمويه» 🎭 الغرفة ${O.code.toUpperCase()}`,url}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(text); O.inviteMsg="نُسخ الرابط ✓ الصقه لأصحابك"; }
  catch(e){ O.inviteMsg="انسخ الرابط الظاهر تحت الزر"; }
  render(); setTimeout(()=>{O.inviteMsg="";render();},3000);
}
function onlineClick(t){
  const a=t.dataset.o;
  if(t.dataset.ochoose){oChoose(t.dataset.ochoose);return true;}
  if(t.dataset.opick!=null){oPick(+t.dataset.opick);return true;}
  if(t.dataset.ostake!=null){O.stake=+t.dataset.ostake;render();return true;}
  if(a&&a[0]==="m"&&O.g&&O.g.md==="mafia"&&mafiaClick(a,t)) return true;
  if(!a) return false;
  if(a==="home"){S.screen="home";render();}
  else if(a==="menu"){O.screen="menu";O.err="";render();}
  else if(a==="create"||a==="join"){O.screen=a;O.err="";render();}
  else if(a==="make") enterRoom(newCode(),true);
  else if(a==="enter") enterRoom(O.codeIn.trim().toLowerCase(),false);
  else if(a==="send") oSendFake();
  else if(a==="invite") shareInvite();
  else if(a==="reclaim"){const i=+t.dataset.i;O.claimSent=i;O.R.presence({rc:{i,n:O.g.pl[i],r:O.g.r}}).catch(()=>{});render();}
  else if(a==="showsc"){O.showSc=true;render();try{window.scrollTo(0,0);}catch(e){}}
  else if(a==="showans"){O.showSc=false;render();}
  else if(a==="crandom"){const av=O.g.cats.filter(([,l])=>l).map(([k])=>k);if(av.length) oChoose(av[Math.floor(Math.random()*av.length)]);}
  else if(a==="leave"){
    const mid=O.g&&["choose","write","pick","reveal","role","night","morning","day","vote","verdict"].includes(O.g.ph);
    if(mid&&!O.leaveArm){O.leaveArm=true;render();setTimeout(()=>{if(O.leaveArm){O.leaveArm=false;render();}},5000);}
    else{O.leaveArm=false;leaveRoom();}
  }
  else if(O.host&&["start","random","skip","next","again"].includes(a)) hostAction(a);
  return true;
}

loadStats();
(function resumeIfNeeded(){
  const ss=readSession();
  // فتح رابط دعوة: يذهب مباشرة إلى شاشة الانضمام مع الرمز
  let inv=null; try{ inv=(new URLSearchParams(location.search).get("room")||"").trim().toLowerCase(); history.replaceState(null,"",location.pathname); }catch(e){}
  if(inv&&/^[a-z0-9]{5}$/.test(inv)&&!(ss&&ss.code===inv)){
    if(ss) clearSession();
    S.screen="online"; O.screen="join"; O.codeIn=inv.toUpperCase(); O.err="";
    return render();
  }
  if(!ss) return render();
  O.name=ss.name||O.name; S.screen="online"; O.screen="game"; O.code=ss.code;
  render();
  enterRoom(ss.code,!!ss.host,true);
})();
</script>
