<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141a2e">
<title>تمويه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one narrow game card per screen, pass-the-phone flow; majlis night palette, committed single dark look */
:root{
  --ink:#141a2e; --ink-2:#1d2540; --ink-3:#2a3456;
  --saffron:#f2b632; --saffron-deep:#c98a12;
  --pom:#e0455e; --mint:#5fd3b0; --sky:#7aa7ff;
  --paper:#f4efe4; --muted:#a5adc8; --line:#33406a;
  --display:"Lalezar","Readex Pro","Segoe UI",Tahoma,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--ink);
  background-image:radial-gradient(circle at 50% -10%, #2b3a78 0, transparent 55%),
    repeating-linear-gradient(45deg, transparent 0 22px, rgba(255,255,255,.025) 22px 23px),
    repeating-linear-gradient(-45deg, transparent 0 22px, rgba(255,255,255,.025) 22px 23px);
  color:var(--paper); font-family:var(--body); font-size:16px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:20px;
}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--saffron);
  text-shadow:0 3px 0 var(--saffron-deep), 0 6px 0 rgba(0,0,0,.35);letter-spacing:0}
.tag{font-size:.8rem;color:var(--muted)}
.round-pill{font-size:.8rem;background:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--ink-2);border:2px solid var(--line);border-radius:22px;padding:20px;
  box-shadow:0 8px 0 #0c1020;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.9rem} h2{font-size:1.45rem}
.eyebrow{font-size:.78rem;color:var(--saffron);letter-spacing:.04em}
.muted{color:var(--muted);font-size:.9rem}
.q{font-size:1.2rem;font-weight:500;line-height:1.7}
.cat-chip{align-self:flex-start;font-size:.78rem;background:var(--ink-3);border-radius:999px;padding:3px 12px;color:var(--sky)}
label{font-size:.9rem;color:var(--muted)}
input[type=text]{width:100%;font:inherit;font-size:1.05rem;color:var(--paper);background:var(--ink);
  border:2px solid var(--line);border-radius:14px;padding:12px 14px}
input[type=text]:focus{outline:none;border-color:var(--saffron)}
.btn{font:inherit;font-family:var(--display);font-size:1.3rem;border:0;border-radius:16px;padding:12px 18px;cursor:pointer;
  color:#2a1a00;background:var(--saffron);box-shadow:0 5px 0 var(--saffron-deep);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--saffron-deep)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn.pom{background:var(--pom);color:#fff;box-shadow:0 5px 0 #9c2238}
.btn.ghost{background:var(--ink-3);color:var(--paper);box-shadow:0 5px 0 #121830}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.players{display:flex;flex-direction:column;gap:8px}
.player-row{display:flex;gap:8px;align-items:center}
.player-row input{flex:1;min-width:0}
.icon-btn{flex:0 0 44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--ink);color:var(--muted);font-size:1.2rem;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.9rem;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--ink);color:var(--muted);cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--saffron);color:var(--paper);background:rgba(242,182,50,.12)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;font-size:1.05rem;text-align:right;padding:14px 16px;border-radius:16px;border:2px solid var(--line);
  background:var(--ink);color:var(--paper);cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .letter{flex:0 0 32px;height:32px;border-radius:10px;background:var(--ink-3);display:grid;place-items:center;font-family:var(--display);color:var(--saffron);font-size:1.1rem}
.opt:hover{border-color:var(--sky)}
.err{color:var(--pom);font-size:.9rem;min-height:1.4em}
.handoff{align-items:center;text-align:center;padding-block:36px}
.handoff .big-name{font-family:var(--display);font-size:3rem;color:var(--saffron);line-height:1.1}
.mascot{width:96px;height:96px}
.reveal-list{display:flex;flex-direction:column;gap:10px}
.rv{border-radius:16px;border:2px solid var(--line);padding:12px 14px;background:var(--ink);display:flex;flex-direction:column;gap:4px}
.rv.true{border-color:var(--mint);background:rgba(95,211,176,.08)}
.rv .ans{font-weight:700}
.rv .who{font-size:.85rem;color:var(--muted)}
.rv .who b{color:var(--paper);font-weight:500}
.badge{font-size:.75rem;border-radius:999px;padding:2px 10px;align-self:flex-start}
.badge.t{background:var(--mint);color:#06281e}
.badge.f{background:var(--ink-3);color:var(--muted)}
.score-list{display:flex;flex-direction:column;gap:8px}
.sc{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--ink)}
.sc .rank{font-family:var(--display);color:var(--muted);width:24px;font-size:1.2rem}
.sc .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.sc .pts{font-family:var(--display);font-size:1.4rem;color:var(--saffron);font-variant-numeric:tabular-nums}
.sc .gain{font-size:.85rem;color:var(--mint);font-variant-numeric:tabular-nums}
.sc.lead{outline:2px solid var(--saffron)}
.rules{margin:0;padding-inline-start:20px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.progress{display:flex;gap:6px;justify-content:center}
.progress span{width:10px;height:10px;border-radius:50%;background:var(--ink-3)}
.progress span.done{background:var(--saffron)}
.timer{display:flex;align-items:center;gap:10px}
.timer .bar{flex:1;height:10px;border-radius:999px;background:var(--ink);overflow:hidden;border:1px solid var(--line)}
.timer .fill{height:100%;width:100%;background:var(--mint);border-radius:999px;transition:width .25s linear,background .3s}
.timer .fill.warn{background:var(--saffron)} .timer .fill.danger{background:var(--pom)}
.timer .sec{font-family:var(--display);font-size:1.4rem;min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}
.cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat-tile{font:inherit;text-align:right;border-radius:18px;border:2px solid var(--line);background:var(--ink);color:var(--paper);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cat-tile b{font-family:var(--display);font-weight:400;font-size:1.25rem;color:var(--saffron)}
.cat-tile small{color:var(--muted);font-size:.8rem}
.cat-tile:hover{border-color:var(--saffron)}
.cat-tile[disabled]{opacity:.35;cursor:not-allowed}
.cat-tile:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.code-box{font-family:var(--display);font-size:3rem;letter-spacing:.25em;text-align:center;color:var(--saffron);background:var(--ink);border:2px dashed var(--line);border-radius:18px;padding:8px 12px;user-select:all}
.you{font-size:.7rem;background:var(--ink-3);color:var(--sky);border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle}
.notice{background:rgba(242,182,50,.12);border:1px solid var(--saffron);color:var(--paper);border-radius:14px;padding:10px 14px;font-size:.9rem}
.btn.small{font-size:1rem;padding:8px 12px;box-shadow:0 3px 0 #121830}
.chip small{opacity:.7;font-size:.75em}
.chip.closed{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.foot{text-align:center;font-size:.75rem;color:var(--muted);margin-top:auto}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
.card{animation:pop .22s ease-out}
@media (prefers-reduced-motion:reduce){.card{animation:none}.btn{transition:none}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

<div id="app" dir="rtl" lang="ar"></div>

<script>
const BANK = [
  // لغة وأدب
  {c:"lang",q:"ماذا كانت تعني كلمة «الهاتف» في الفصحى القديمة؟",a:"صوت يُسمع ولا يُرى صاحبه",d:["الطبل الذي يُقرع لإعلان الحرب","الحمام الزاجل الذي يحمل الرسائل","الرسول الذي يحمل الأخبار","الجبل العالي الذي يُنادى منه","صوت الرعد"]},
  {c:"lang",q:"ماذا تعني كلمة «سيّارة» في سورة يوسف؟",a:"القافلة من المسافرين",d:["البئر العميقة","النجم الذي يهتدي به المسافرون","الكواكب التي تسير في السماء","الإبل المحمّلة بالماء","جماعة الحرس"]},
  {c:"lang",q:"ماذا كانت تعني «الجريدة» في الأصل؟",a:"سعفة النخل بعد نزع خوصها",d:["الخيل التي تسبق الجيش","الأرض الجرداء","قائمة أسماء الجند","الرمح الطويل","الثوب الممزق"]},
  {c:"lang",q:"ماذا كان يعني «الشَّنَب» في الفصحى القديمة؟",a:"بياض الأسنان وبريقها",d:["طرف السيف الحاد","الشعر النابت قبل اللحية","تجعّد الجبين","الصوت الأجش","شدة العطش"]},
  {c:"lang",q:"ماذا كانت تعني «السُّفرة» في الأصل؟",a:"طعام المسافر",d:["جلد الناقة المدبوغ","خريطة الطريق","ورقة الكتابة","حقيبة الدراهم","مقعد الراكب على الناقة"]},
  {c:"lang",q:"ماذا كانت تعني «القهوة» عند العرب قبل معرفة البن؟",a:"الخمر",d:["اللبن الحامض","التمر المجفف","الحليب الساخن","الماء البارد","العصير المحلّى بالعسل"]},
  {c:"lang",q:"«الإسكافي» في التراث العربي هو صانع ماذا؟",a:"الأحذية",d:["السكاكين","السروج","الأقفال","الأواني الفخارية","الحبال"]},
  {c:"lang",q:"ما معنى «الغَضَنْفَر»؟",a:"الأسد",d:["النسر الضخم","الذئب الأسود","الصقر","الفيل","الحصان الأصيل"]},
  {c:"lang",q:"ماذا يُسمّى صوت الحمامة في العربية؟",a:"الهديل",d:["الصفير","النقيق","الصياح","العواء","النعيق"]},
  {c:"lang",q:"من الشاعر الملقب بـ«الملك الضِّلّيل»؟",a:"امرؤ القيس",d:["عنترة بن شداد","النابغة الذبياني","المتنبي","زهير بن أبي سلمى","طرفة بن العبد"]},
  {c:"lang",q:"ما معنى «الدُّجى»؟",a:"الظلام",d:["المطر الخفيف","الغبار","الندى","السحاب الكثيف","الرياح الباردة"]},
  {c:"lang",q:"كلمة «صِفر» العربية انتقلت إلى الإنجليزية وصارت أي كلمة؟",a:"Zero",d:["Sphere","Zephyr","Sapphire","Saffron","Zenith"]},
  // تاريخ
  {c:"hist",q:"كم دقيقة استمرت الحرب بين بريطانيا وزنجبار عام 1896 تقريباً؟",a:"38 دقيقة",d:["3 ساعات","يومان","6 أشهر","أسبوع","12 ساعة"]},
  {c:"hist",q:"أي خليفة أمر بضرب أول عملة إسلامية عربية خالصة؟",a:"عبد الملك بن مروان",d:["هارون الرشيد","عمر بن عبد العزيز","عثمان بن عفان","المأمون","معاوية بن أبي سفيان"]},
  {c:"hist",q:"بنى أبو جعفر المنصور مدينة لتكون عاصمة الدولة العباسية. ما هي؟",a:"بغداد",d:["سامراء","الكوفة","البصرة","الرقة","الموصل"]},
  {c:"hist",q:"كم سنة استمرت حرب البسوس بحسب الروايات المشهورة؟",a:"أربعون سنة",d:["سبع سنوات","مئة سنة","عشر سنوات","عشرون سنة","سنتان"]},
  {c:"hist",q:"ما الحيوان الذي استخدمه هانيبال لعبور جبال الألب؟",a:"الفيلة",d:["الجمال","البغال المدرعة","الثيران","الخيول البربرية","الكلاب الضخمة"]},
  {c:"hist",q:"من بنى قصر الحمراء في غرناطة؟",a:"بنو الأحمر",d:["المرابطون","بنو أمية","الموحدون","بنو عباد","الفاطميون"]},
  {c:"hist",q:"في أي عام سقطت غرناطة آخر معاقل المسلمين في الأندلس؟",a:"1492",d:["1258","1453","1212","1517","1609"]},
  {c:"hist",q:"ما عاصمة الدولة الأموية؟",a:"دمشق",d:["القدس","حلب","بغداد","المدينة المنورة","الكوفة"]},
  {c:"hist",q:"من اخترع الطباعة بالحروف المتحركة في أوروبا؟",a:"يوهان غوتنبرغ",d:["ليوناردو دافنشي","مارتن لوثر","إسحاق نيوتن","توماس إديسون","جيمس وات"]},
  {c:"hist",q:"على أي مادة كان المصريون القدماء يكتبون؟",a:"ورق البردي",d:["جلد الماعز","ألواح النحاس","ورق التوت","جلود الغزلان","سعف النخل"]},
  {c:"hist",q:"ما اسم الطريق التجاري القديم الذي ربط الصين بالعالم؟",a:"طريق الحرير",d:["طريق البخور","طريق الذهب","طريق التوابل","طريق الملح","طريق الفيلة"]},
  {c:"hist",q:"من فتح القسطنطينية عام 1453؟",a:"محمد الفاتح",d:["سليمان القانوني","صلاح الدين الأيوبي","عثمان الأول","بايزيد الأول","مراد الثاني"]},
  {c:"hist",q:"في أي عام غرقت السفينة تيتانيك؟",a:"1912",d:["1905","1923","1899","1915","1931"]},
  // جغرافيا
  {c:"geo",q:"ما عاصمة أستراليا؟",a:"كانبرا",d:["سيدني","ملبورن","بيرث","بريزبن","أديلايد"]},
  {c:"geo",q:"ما الدولة الوحيدة التي علمها ليس مستطيلاً ولا مربعاً؟",a:"نيبال",d:["بوتان","سويسرا","الدنمارك","اليابان","سريلانكا"]},
  {c:"geo",q:"أي دولة تملك أكبر عدد من البحيرات في العالم؟",a:"كندا",d:["فنلندا","روسيا","السويد","النرويج","الولايات المتحدة"]},
  {c:"geo",q:"ما اسم أعمق نقطة معروفة في محيطات الأرض؟",a:"خندق ماريانا",d:["خندق بورتوريكو","هوة بايكال","خندق جاوة","خندق تونغا","حفرة الأطلسي الكبرى"]},
  {c:"geo",q:"كم دولة تحدّ السعودية برّاً؟",a:"سبع دول",d:["خمس دول","تسع دول","ست دول","أربع دول","عشر دول"]},
  {c:"geo",q:"ما أصغر دولة في العالم مساحة؟",a:"الفاتيكان",d:["موناكو","سان مارينو","ليختنشتاين","مالطا","أندورا"]},
  {c:"geo",q:"ما عاصمة كندا؟",a:"أوتاوا",d:["تورنتو","مونتريال","فانكوفر","كيبيك","كالغاري"]},
  {c:"geo",q:"ما أكبر دولة عربية مساحة؟",a:"الجزائر",d:["السعودية","السودان","ليبيا","مصر","موريتانيا"]},
  {c:"geo",q:"ما المدينة الكبرى التي تقع في قارتين؟",a:"إسطنبول",d:["القاهرة","موسكو","أثينا","باكو","تبليسي"]},
  {c:"geo",q:"في أي بحر يطفو الإنسان بسهولة بسبب شدة ملوحته؟",a:"البحر الميت",d:["البحر الأحمر","بحر قزوين","البحر الأسود","بحر العرب","البحر المتوسط"]},
  {c:"geo",q:"كم عدد القارات في التقسيم الأكثر شيوعاً؟",a:"سبع قارات",d:["ست قارات","خمس قارات","أربع قارات","تسع قارات","ثماني قارات"]},
  {c:"geo",q:"ما عاصمة تركيا؟",a:"أنقرة",d:["إسطنبول","إزمير","أنطاليا","بورصة","قونية"]},
  // علوم
  {c:"sci",q:"ما أكبر عضو في جسم الإنسان؟",a:"الجلد",d:["الكبد","الأمعاء الدقيقة","القلب","الرئتان","الدماغ"]},
  {c:"sci",q:"كم قلباً يملك الأخطبوط؟",a:"ثلاثة قلوب",d:["قلبان","ثمانية قلوب","قلب واحد","أربعة قلوب","خمسة قلوب"]},

  {c:"sci",q:"ما المعدن الذي يكون سائلاً في درجة حرارة الغرفة؟",a:"الزئبق",d:["الصوديوم","الرصاص","الألمنيوم","القصدير","النحاس"]},
  {c:"sci",q:"كم عظمة في جسم الإنسان البالغ؟",a:"206",d:["300","186","212","250","150"]},
  {c:"sci",q:"ما الغاز الذي تمتصه النباتات من الهواء لصنع غذائها؟",a:"ثاني أكسيد الكربون",d:["النيتروجين","الأكسجين","الهيليوم","الأوزون","الهيدروجين"]},
  {c:"sci",q:"أي كوكب يُلقّب بالكوكب الأحمر؟",a:"المريخ",d:["المشتري","زحل","عطارد","الزهرة","أورانوس"]},
  {c:"sci",q:"ما أصلب مادة طبيعية معروفة؟",a:"الألماس",d:["التيتانيوم","الياقوت","الزمرد","الغرانيت","الكوارتز"]},
  {c:"sci",q:"كم يستغرق ضوء الشمس ليصل إلى الأرض تقريباً؟",a:"8 دقائق",d:["ثانية واحدة","ساعة كاملة","30 ثانية","24 ساعة","3 دقائق"]},
  {c:"sci",q:"ما العنصر الأكثر وفرة في الكون؟",a:"الهيدروجين",d:["الأكسجين","الهيليوم","الكربون","النيتروجين","الحديد"]},
  {c:"sci",q:"كم سناً للإنسان البالغ عادة؟",a:"32",d:["28","36","30","40","24"]},

// الأرقام: نوحّد الأرقام العربية (٠١٢) والإنجليزية (012) والأعداد المكتوبة بالحروف (أربع، اثنا عشر)
const NUMW={"واحد":1,"واحده":1,"اثنان":2,"اثنين":2,"اثنتان":2,"اثنتين":2,"اثنا":2,"اثني":2,"اثنتا":2,"اثنتي":2,"مرتان":2,"مرتين":2,
  "ثلاث":3,"ثلاثه":3,"اربع":4,"اربعه":4,"خمس":5,"خمسه":5,"ست":6,"سته":6,"سبع":7,"سبعه":7,"ثمان":8,"ثماني":8,"ثمانيه":8,"تسع":9,"تسعه":9,
  "عشر":10,"عشره":10,"عشرون":20,"عشرين":20,"ثلاثون":30,"ثلاثين":30,"اربعون":40,"اربعين":40,"خمسون":50,"خمسين":50,"ستون":60,"ستين":60,
  "سبعون":70,"سبعين":70,"ثمانون":80,"ثمانين":80,"تسعون":90,"تسعين":90,"مئه":100,"مائه":100,
  "zero":0,"one":1,"two":2,"three":3,"four":4,"five":5,"six":6,"seven":7,"eight":8,"nine":9,"ten":10,"eleven":11,"twelve":12,
  "thirteen":13,"fourteen":14,"fifteen":15,"sixteen":16,"seventeen":17,"eighteen":18,"nineteen":19,"twenty":20,"thirty":30,
  "forty":40,"fifty":50,"sixty":60,"seventy":70,"eighty":80,"ninety":90,"hundred":100,"thousand":1000};
function numWord(t){
  if(t in NUMW) return NUMW[t];
  if(t.startsWith("و")&&t.slice(1) in NUMW) return NUMW[t.slice(1)];
  if(t.startsWith("ال")&&t.slice(2) in NUMW) return NUMW[t.slice(2)];
  return null;
}
const norm=s=>{
  let x=String(s).trim().toLowerCase()
    .replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-0x660)).replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-0x6F0))
    .replace(/[ً-ْـ]/g,"").replace(/[إأآا]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[ئؤ]/g,"ء")
    .replace(/ﷺ|صلي الله عليه وسلم|عليه السلام|عليها السلام|عليهم السلام|رضي الله عنه|رضي الله عنها/g," ");
  const out=[];let acc=null;
  x.split(/[\s-]+/).forEach(t=>{const v=numWord(t);
    if(v!=null){acc=(v>=100&&acc)?acc*v:(acc||0)+v;} else {if(acc!=null){out.push(String(acc));acc=null;} out.push(t);} });
  if(acc!=null) out.push(String(acc));
  // «الأنف» و«بالأنف» و«والأنف» و«للأنف» كلها تصبح «انف»
  return out.map(t=>t.length>4&&/^(وال|فال|بال|كال)/.test(t)?t.slice(3):t.length>3&&/^(ال|لل)/.test(t)?t.slice(2):t)
    .map(t=>t.replace(/[^\p{L}\p{N}]+/gu,"")).filter(Boolean).join(" ");
};

function tick(){

// مسافة التحرير: كم حرفاً يجب تغييره لتصبح الكلمة الأولى هي الثانية
function lev(a,b){
  if(a===b) return 0; if(!a.length) return b.length; if(!b.length) return a.length;
  let prev=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){const cur=[i];
    for(let j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]||(a[i-1]==="ء"&&"ياو".includes(b[j-1]))||(b[j-1]==="ء"&&"ياو".includes(a[i-1]))?0:1));
    prev=cur;}
  return prev[b.length];
}
const SIM_RATIO=0.8; // 80% تشابه في الحروف وترتيبها = نفس الإجابة
function sim(a0,b0){
  const a=a0.replace(/ /g,""), b=b0.replace(/ /g,"");
  const digits=/\d/.test(a)&&/\d/.test(b);
  if(a===b||!digits&&(Math.min(a.length,b.length)>=3&&(a.includes(b)||b.includes(a)))) return true;
  if(!/\d/.test(a)&&!/\d/.test(b)){
    // نحذف الكلمات المشتركة أولاً، فلا يتشابه «المحيط الهادئ» و«المحيط الهندي» بسبب كلمة «المحيط»
    const ta=a0.split(" "), tb=b0.split(" ");
    const x=ta.filter(t=>!tb.includes(t)).join(""), y=tb.filter(t=>!ta.includes(t)).join("");
    const m=Math.max(x.length,y.length);
    if(x&&y&&m>=4&&1-lev(x,y)/m>=SIM_RATIO) return true;
  }
  // إذا احتوى الجوابان أرقاماً، فهما متطابقان إذا كانت الأرقام نفسها (مثل «٢٠٦» و«206»، أو «4» و«أربع حجرات»)
  const na=(a.match(/\d+/g)||[]).sort().join(","), nb=(b.match(/\d+/g)||[]).sort().join(",");
  if(!na||na!==nb) return false;
  // نفس الأرقام: نعتبرهما متطابقين إلا إذا اختلفت الوحدة صراحةً (مثل «ثانية واحدة» و«دقيقة واحدة»)
  const la=a.replace(/\d+/g,""), lb=b.replace(/\d+/g,"");
  if(!la||!lb||la===lb||(Math.min(la.length,lb.length)>2&&(la.includes(lb)||lb.includes(la)))) return true;
  const m=Math.max(la.length,lb.length);
  return m>=4&&1-lev(la,lb)/m>=SIM_RATIO;
}
function fakeError(v){
  if(!v.length) return "اكتب إجابتك أولاً.";
  if(sim(norm(v),norm(S.cur.a))) return "هذه قريبة جداً من الإجابة الصحيحة! اكتب كذبة مختلفة.";
  return "";
}
function submitFake(timedOut){

function buildOptions(){
  // كذبات متشابهة من لاعبين مختلفين تُدمج في خيار واحد يُنسب لهم جميعاً
  const groups=[];
  Object.entries(S.fakes).forEach(([p,t])=>{const k=norm(t);const g=groups.find(g=>sim(g.k,k));
    if(g) g.owner.push(+p); else groups.push({k,text:t,owner:[+p]});});
  const o=[{text:S.cur.a,owner:"true"},...groups.map(g=>({text:g.text,owner:g.owner}))];
  // فخاخ اللعبة تُختار بعد كتابة الجميع، ويُستبعد أي فخ يشبه كذبة لاعب
  const free=shuffle(S.cur.d).filter(d=>!groups.some(g=>sim(g.k,norm(d))));
  free.slice(0,Math.min(free.length,Math.max(1,4-o.length))).forEach(t=>o.push({text:t,owner:"house"}));
  S.options=shuffle(o); S.phase="pick"; S.turn=0; S.screen="handoff";
}
function pick(i){
  stopTimer();
  S.picks[S.turn]=i;
  if(S.turn<S.players.length-1){S.turn++;S.screen="handoff";render();return;}
  score(); S.screen="reveal"; render();
}
function score(){
  S.players.forEach((_,p)=>{
    let g=0; const ch=S.options[S.picks[p]];
    if(ch&&ch.owner==="true") g+=2;
    g+=Object.entries(S.picks).filter(([q,v])=>+q!==p&&v>=0&&Array.isArray(S.options[v].owner)&&S.options[v].owner.includes(p)).length;
    S.gains[p]=g; S.scores[p]=(S.scores[p]||0)+g;
  });
}

const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]);
function fbRoomApi(){
  const db=fbInit(); if(!db) return null;
  return {join: async(name)=>{
    const roomRef=db.ref("rooms/"+name), base=roomRef.child("peers"), me=base.child(myPid), connRef=db.ref(".info/connected");
    // لا نحذف اللاعب عند انقطاع قصير: نعلّمه غير متصل، ونعيد تثبيت حالته كاملة عند عودة الاتصال
    const full={};
    await withTimeout(me.child("joined").transaction(v=>v||Date.now()),10000);
    await withTimeout(me.update({on:true}),10000);
    let off=null;
    const api={
      onReconnect:null,
      presence:(patch)=>{for(const k in patch){if(patch[k]===null) delete full[k]; else full[k]=patch[k];} return me.update(patch);},
      saveState:(str)=>roomRef.child("hs").set(str),
      // سجل الأسئلة لكل لاعب (بمعرّف جهازه)، مستقل عن الغرفة والمضيف
      loadSeen:async(pid)=>{const sn=await withTimeout(db.ref("seen/"+pid).once("value"),8000);return Object.keys(sn.val()||{});},
      markSeen:(pids,id)=>{const u={};pids.forEach(p=>u["seen/"+p+"/"+id]=true);return db.ref().update(u);},
      loadState:async()=>{const sn=await withTimeout(roomRef.child("hs").once("value"),10000);return sn.val();},
      onPeers:(h,err)=>{
        const cb=snap=>{const v=snap.val()||{};
          const peers=Object.entries(v).map(([pid,p])=>({peer:pid,sameTab:pid===myPid,isMe:pid===myPid,kind:"viewer",presence:p||{}}))
            .sort((a,b)=>(a.presence.joined||0)-(b.presence.joined||0));
          h({peers});};
        base.on("value",cb,e=>err&&err(e)); off=()=>base.off("value",cb); return off;
      },
      leave: async()=>{ connRef.off("value",onConn); if(off) off(); try{await me.onDisconnect().cancel();}catch(e){} await me.remove(); }
    };
    const onConn=snap=>{
      if(snap.val()!==true) return;
      me.onDisconnect().update({on:false});
      me.update(Object.assign({},full,{on:true}));
      if(api.onReconnect) api.onReconnect();
    };
    connRef.on("value",onConn);
    return api;
  }};
}
// Firebase يحذف المصفوفات الفارغة ويحوّل بعض الكائنات، فنعيد الحالة إلى شكلها المتوقع
function normG(g){
  if(!g) return g;
  const A=x=>Array.isArray(x)?x:(x&&typeof x==="object"?Object.values(x):[]);
  ["pl","pp","sc","dn","nf","np","gn","cats","q"].forEach(k=>{ if(g[k]!=null) g[k]=A(g[k]); });
  g.pl=g.pl||[];g.pp=g.pp||[];g.sc=g.sc||[];g.dn=g.dn||[];g.nf=g.nf||[];g.np=g.np||[];g.bad=g.bad||{};
  if(g.cats) g.cats=g.cats.map(A);
  if(g.op) g.op=A(g.op).map(x=>{x=A(x);return [x[0], x[1]==null?[]:(typeof x[1]==="string"?x[1]:A(x[1])), A(x[2])];});
  return g;
}

    if(resume){ try{ const st=await O.R.loadState(); if(st){ for(const k in HS) delete HS[k]; Object.assign(HS,JSON.parse(st)); restored=true; } }catch(e){} }
    if(!restored) Object.assign(HS,{phase:"lobby",players:[],scores:{},round:0,rounds:S.rounds,timer:S.timer,cats:S.cats.slice(),used:[],deadline:0});
    lastPub="";
    hostIv=setInterval(hostStep,500);
  }
  O.R.onReconnect=()=>{ lastPub=""; if(O.host) publish(); };
  if(host&&HS.players) HS.players.forEach(p=>loadSeenFor(p.p));
  saveSession(); keepAwake();
  O.R.presence({n:nm.slice(0,16),h:host?1:0}).catch(()=>{});
  O.R.onPeers(ch=>{O.peers=ch.peers;onRoom();},()=>{O.err="انقطع الاتصال بالغرفة.";render();});
  clientIv=setInterval(clientTick,250);
  render();
}
function leaveRoom(){
  clearSession();
  if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;}
  clearInterval(hostIv);clearInterval(clientIv);hostIv=clientIv=null;
  if(O.R) O.R.leave().catch(()=>{});
  Object.assign(O,{gs:"",screen:"menu",R:null,g:null,peers:[],host:false,code:"",key:"",deadline:0,err:""});
  S.screen="online";render();
}

function onRoom(){
  if(O.host) hostStep();
  const hp=O.peers.find(p=>p.presence&&p.presence.h&&p.presence.g);
  const g=hp?hp.presence.g:null;
  if(g) O.hostGoneAt=0; else if(!O.hostGoneAt) O.hostGoneAt=Date.now();
  const off=!!(hp&&hp.presence.on===false&&!O.host);
  if(off!==O.hostOff){O.hostOff=off; if(O.g) render();}
  if(O.host){ if(O.g&&O.g.ph==="lobby") render(); return; }
  setG(g);
}
function clientTick(){
  if(S.screen!=="online"||O.screen!=="game") return;
  if(O.deadline&&O.g){
    const total=O.g.rem||1,left=Math.max(0,O.deadline-Date.now()),frac=left/total;
    const fl=document.getElementById("tfill"),sc=document.getElementById("tsec");
    if(fl){fl.style.width=(frac*100)+"%";fl.className="fill"+(frac<.25?" danger":frac<.5?" warn":"");}
    if(sc) sc.textContent=Math.ceil(left/1000);
  }
  if(!O.g&&O.hostGoneAt&&Date.now()-O.hostGoneAt>6000&&!document.getElementById("hostgone")) render();
}

// ---------- منطق المضيف ----------
function hostStep(){
  if(!O.host||!O.R) return;
  const H=HS,now=Date.now();
  if(H.phase==="lobby"){
    const me=myPeer(),seen=[];
    O.peers.forEach(p=>{if(p.kind==="viewer"&&p.presence&&p.presence.n&&p.presence.on!==false&&!seen.some(s=>s.p===p.peer)) seen.push({p:p.peer,n:String(p.presence.n).slice(0,16)});});
    seen.sort((a,b)=>(b.p===me)-(a.p===me));
    H.players=seen.slice(0,8);
    H.players.forEach(p=>loadSeenFor(p.p));
  }else if(H.phase==="choose"){
    const ch=H.players[(H.round-1)%H.players.length],pr=pres(ch.p);
    if(pr&&pr.c&&pr.c.r===H.round&&H.cats.includes(pr.c.k)&&remainingIn(H.used,pr.c.k)) hostSetQ(pr.c.k);
  }else if(H.phase==="write"){
    H.players.forEach((pl,i)=>{
      const pr=pres(pl.p),f=pr&&pr.f;
      if(f&&f.r===H.round&&typeof f.t==="string"&&f.a!==H.seenA[i]){
        H.seenA[i]=f.a;const t=f.t.trim().slice(0,40);
        if(!t.length||sim(norm(t),norm(H.cur.a))){H.bad[i]=f.a;delete H.fakes[i];}
        else{H.fakes[i]=t;delete H.bad[i];}
      }
    });
    if(H.players.every((_,i)=>H.fakes[i]!=null)||(H.deadline&&now>H.deadline)) hostToPick();
  }else if(H.phase==="pick"){
    H.players.forEach((pl,i)=>{
      const pr=pres(pl.p),k=pr&&pr.k;
      if(k&&k.r===H.round&&Number.isInteger(k.i)&&k.i>=0&&k.i<H.opts.length&&!(Array.isArray(H.opts[k.i].o)&&H.opts[k.i].o.includes(i))) H.picks[i]=k.i;
    });
    if(H.players.every((_,i)=>H.picks[i]!=null)||(H.deadline&&now>H.deadline)) hostToReveal();
  }
  publish();
}
function hostDeadline(){HS.deadline=HS.timer?Date.now()+HS.timer*1000:0;}
function hostNextRound(){
  const H=HS;H.out=0;
  if(!H.cats.some(k=>remainingIn(0,k))){H.phase="final";H.out=1;H.deadline=0;return;}
  H.round++;H.phase="choose";H.deadline=0;H.cur=null;H.opts=[];H.fakes={};H.bad={};H.seenA={};H.picks={};H.gains={};
}
function hostSetQ(k){
  const H=HS;
  if(k==="random"){const av=H.cats.filter(c=>remainingIn(H.used,c));if(!av.length) return;k=av[Math.floor(Math.random()*av.length)];}
  const q=takeQRoom(k);
  if(!q) return;
  H.cur=q;H.phase="write";hostDeadline();
}
function hostToPick(){
  const H=HS,groups=[];
  Object.entries(H.fakes).forEach(([p,t])=>{const k=norm(t),g=groups.find(g=>sim(g.k,k));if(g) g.o.push(+p);else groups.push({k,t,o:[+p]});});
  const o=[{t:H.cur.a,o:"T"},...groups.map(g=>({t:g.t,o:g.o}))];
  const free=shuffle(H.cur.d).filter(d=>!groups.some(g=>sim(g.k,norm(d))));
  free.slice(0,Math.min(free.length,Math.max(1,4-o.length))).forEach(t=>o.push({t,o:"H"}));
  H.opts=shuffle(o);H.phase="pick";H.picks={};hostDeadline();
}
function hostToReveal(){
  const H=HS;
  H.players.forEach((_,p)=>{
    let g=0;const ch=H.opts[H.picks[p]];
    if(ch&&ch.o==="T") g+=2;
    g+=Object.entries(H.picks).filter(([q,v])=>+q!==p&&Array.isArray(H.opts[v].o)&&H.opts[v].o.includes(p)).length;
    H.gains[p]=g;H.scores[p]=(H.scores[p]||0)+g;
  });
  H.phase="reveal";H.deadline=0;
}
function hostAction(a){
  const H=HS;
  if(a==="start"){if(!H.players.length) return; if(H.players.some(p=>!SEEN[p.p])){H.players.forEach(p=>loadSeenFor(p.p));return;}H.scores={};H.round=0;hostNextRound();}
  else if(a==="random"&&H.phase==="choose") hostSetQ("random");
  else if(a==="skip"){if(H.phase==="write") hostToPick();else if(H.phase==="pick") hostToReveal();}
  else if(a==="next"&&H.phase==="reveal"){if(H.round>=H.rounds){H.phase="final";}else hostNextRound();}
  else if(a==="again"&&H.phase==="final"){H.scores={};H.round=0;hostNextRound();}
  publish();
}
function buildG(){
  const H=HS,n=H.players.length;
  const g={out:H.out?1:0,ph:H.phase,r:H.round,rs:H.rounds,pl:H.players.map(p=>p.n),pp:H.players.map(p=>p.p),sc:H.players.map((_,i)=>H.scores[i]||0)};
  if(H.phase==="choose"&&n){g.ch=(H.round-1)%n;g.cats=H.cats.map(k=>[k,remainingIn(H.used,k)]);}
  if(H.cur&&(H.phase==="write"||H.phase==="pick"||H.phase==="reveal")) g.q=[H.cur.c,H.cur.q];
  if(H.phase==="write"){g.rem=H.timer*1000;g.dn=Object.keys(H.fakes).map(Number);g.bad=H.bad;}
  if(H.phase==="pick"){g.rem=H.timer*1000;g.op=H.opts.map(o=>[o.t,Array.isArray(o.o)?o.o:[]]);g.dn=Object.keys(H.picks).map(Number);}
  if(H.phase==="reveal"){
    g.op=H.opts.map((o,j)=>[o.t,o.o,Object.entries(H.picks).filter(([,v])=>v===j).map(([p])=>+p)]);
    g.gn=H.players.map((_,i)=>H.gains[i]||0);
    g.nf=H.players.map((_,i)=>i).filter(i=>H.fakes[i]==null);
    g.np=H.players.map((_,i)=>i).filter(i=>H.picks[i]==null);
    g.last=H.round>=H.rounds?1:0;
  }
  return g;
}
function publish(){
  if(!O.R) return;
  const g=buildG(),s=JSON.stringify(g);
  if(s===lastPub) return;
  lastPub=s;
  O.R.presence({g}).catch(()=>{});
  try{ O.R.saveState(JSON.stringify(HS)).catch(()=>{}); }catch(e){}
  setG(g);
}
function setG(g){
  const gs=g?JSON.stringify(g):"";
  if(gs===O.gs) return;
  O.gs=gs; g=g?normG(JSON.parse(gs)):null;
  O.g=g;
  if(g){const k=g.r+":"+g.ph; if(k!==O.key){O.key=k;O.deadline=g.rem?Date.now()+g.rem:0;O.myA=O.sentA=0;O.err="";}}
  render();
}

}

(function resumeIfNeeded(){
  const ss=readSession();
  if(!ss) return render();
  O.name=ss.name||O.name; S.screen="online"; O.screen="game"; O.code=ss.code;
  render();
  enterRoom(ss.code,!!ss.host,true);
})();
</script>
